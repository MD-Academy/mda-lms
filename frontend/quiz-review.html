<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>Medical Doctor Academy — Quiz Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/student.css?v=4">
    <style>
        .rv-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
        .rv-tag.correct { background: #dcfce7; color: #15803d; }
        .rv-tag.wrong { background: #fee2e2; color: #b91c1c; }
        .opt.picked { border-color: var(--blue-500); background: #eff5ff; }
    </style>
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script>
        function esc(s){ return s ? String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : ''; }

        (async () => {
            const auth = await requireStudent();
            if (!auth) return;
            const quizId = new URLSearchParams(location.search).get('id');
            if (!quizId) { location.href = 'courses.html'; return; }
            renderLayout('courses', 'Quiz Review', 'Your answers from your last attempt', auth.profile);
            const content = document.getElementById('page-content');
            content.innerHTML = `<div class="loader">Loading…</div>`;

            let data;
            try {
                data = await apiRequest('POST', '/student/quiz-review', { quiz_id: quizId });
            } catch (err) {
                content.innerHTML = `<div class="empty-state"><h3>Couldn't load this review</h3><p>${esc(err.message)}</p><a class="btn btn-ghost" onclick="history.back()" style="margin-top:12px;cursor:pointer;">Back</a></div>`;
                return;
            }
            const { quiz, questions, attempt } = data;

            if (!attempt) {
                content.innerHTML = `<div class="empty-state"><h3>${esc(quiz.title || 'Quiz')}</h3><p>You haven't attempted this quiz yet.</p><a class="btn btn-ghost" onclick="history.back()" style="margin-top:12px;cursor:pointer;">Back</a></div>`;
                return;
            }

            const pass = attempt.score >= 100;
            content.innerHTML = `
                <div class="exam-meta">
                    <h2>${esc(quiz.title || 'Quiz')}</h2>
                    <p>Your last attempt: <strong style="color:${pass ? 'var(--green)' : 'var(--red)'};">${attempt.score}%</strong> ${pass ? '— Passed ✓' : ''} · ${new Date(attempt.completed_at).toLocaleString('en-GB')}</p>
                </div>
                ${(questions || []).map((q, i) => {
                    const opts = Array.isArray(q.options_json) ? q.options_json : [];
                    return `<div class="q-card">
                        <div class="q-num">Question ${i + 1} of ${questions.length}${q.picked_index == null ? ' <span style="color:var(--text-muted);font-weight:400;">— not answered</span>' : `<span class="rv-tag ${q.was_correct ? 'correct' : 'wrong'}">${q.was_correct ? 'Correct' : 'Incorrect'}</span>`}</div>
                        <div class="q-text">${esc(q.question_text)}</div>
                        ${opts.map((o, oi) => `<div class="opt${oi === q.picked_index ? ' picked' : ''}">${esc(o)}${oi === q.picked_index ? ' <strong>(your answer)</strong>' : ''}</div>`).join('')}
                    </div>`;
                }).join('')}
                <div style="margin-top:8px;"><a class="btn btn-ghost" onclick="history.back()" style="cursor:pointer;">Back</a></div>`;
        })();
    </script>
</body>
</html>
