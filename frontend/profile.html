<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>Medical Doctor Academy — Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/student.css?v=4">
    <style>
        .avatar-big { width: 84px; height: 84px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
            background: linear-gradient(135deg, var(--navy-800), var(--blue-500)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 28px; }
        .avatar-big img { width: 100%; height: 100%; object-fit: cover; }
        .prof-wrap { max-width: 640px; }
        .prof-wrap .panel { padding: 30px 34px; }
        .prof-wrap .form-field { margin-bottom: 22px; }
        .prof-wrap .form-field input, .prof-wrap .form-field select { max-width: 360px; }
        .prof-wrap .form-field input[disabled] { max-width: 460px; }
        .notify-row { display: flex; align-items: center; justify-content: space-between; gap: 18px;
            padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
        .notify-row:last-of-type { border-bottom: none; }
        .notify-row .notify-sub { color: var(--text-muted); font-size: 12.5px; font-weight: 400; }
        .notify-row input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--blue-500); cursor: pointer; }
</style>
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/mfa.js"></script>
    <script>
        function esc(s){ return s ? String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : ''; }
        const ALLOWED_IMG = ['png','jpg','jpeg','webp','gif'];
        const AVATAR_MAX = 500 * 1024;
        const TITLES = ['', 'Mr', 'Mrs', 'Ms', 'Mx', 'Dr'];
        let AUTH = null;

        (async () => {
            const auth = await requireStudent();
            if (!auth) return;
            AUTH = auth;
            renderLayout('profile', 'My Profile', 'Your account details', auth.profile);

            const email = auth.session.user.email || '—';
            const initials = (auth.profile.full_name || 'S').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
            const { data: prof } = await db.from('profiles').select('title, notify_announcements, notify_schedule').eq('id', auth.session.user.id).single();
            const myTitle = (prof && prof.title) || '';
            // Default to ON if the column is missing/null (opt-out model).
            const notifyAnn = !prof || prof.notify_announcements !== false;
            const notifySched = !prof || prof.notify_schedule !== false;
            document.getElementById('page-content').innerHTML = `
                <div class="prof-wrap">
                    <div class="panel" style="margin-bottom:22px; display:flex; align-items:center; gap:18px;">
                        <div class="avatar-big" id="avatar-big">${auth.profile.avatar_url ? `<img src="${esc(auth.profile.avatar_url)}" alt="">` : initials}</div>
                        <div>
                            <button class="btn btn-primary" id="prof-avatar-btn">Upload Photo</button>
                            <input type="file" id="prof-avatar-input" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none">
                            <div class="hint" id="avatar-msg" style="margin-top:8px;">PNG, JPG, WEBP or GIF — up to 500&nbsp;KB.</div>
                        </div>
                    </div>
                    <div class="panel" style="margin-bottom:22px;">
                        <div class="alert" id="det-alert" style="display:none;"></div>
                        <div class="form-field">
                            <label>Title</label>
                            <select id="f-title" style="width:100%;height:46px;border:1.5px solid var(--border);border-radius:10px;padding:0 12px;font-family:'Inter',sans-serif;font-size:14px;outline:none;">${TITLES.map(t=>`<option value="${t}" ${t===myTitle?'selected':''}>${t||'—'}</option>`).join('')}</select>
                        </div>
                        <div class="form-field"><label>Full Name <span style="color:var(--text-muted);font-weight:400;">(set by the office)</span></label><input type="text" value="${esc(auth.profile.full_name||'')}" disabled></div>
                        <div class="form-field"><label>Email</label><input type="text" value="${esc(email)}" disabled></div>
                        <button type="button" class="btn btn-primary" id="det-btn">Save Title</button>
                    </div>
                    <div class="panel" id="certs-panel" style="margin-bottom:22px;display:none;">
                        <div class="section-title" style="margin-bottom:6px;">🎓 My Certificates</div>
                        <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px;">Your diploma and recommendation letter, awarded by the Academy.</p>
                        <div id="certs-list"></div>
                    </div>
                    <div class="panel">
                        <div class="section-title" style="margin-bottom:16px;">Change Password</div>
                        <div class="alert" id="pw-alert" style="display:none;"></div>
                        <form id="pw-form">
                            <div class="form-field"><label>New Password</label><input type="password" id="pw1" placeholder="At least 8 characters" required></div>
                            <div class="form-field"><label>Confirm New Password</label><input type="password" id="pw2" placeholder="Re-type the new password" required></div>
                            <button type="submit" class="btn btn-primary" id="pw-btn">Update Password</button>
                        </form>
                    </div>
                    <div class="panel" style="margin-top:22px;">
                        <div class="section-title" style="margin-bottom:6px;">Email Notifications</div>
                        <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px;">Choose which updates we email you. You can change these anytime.</p>
                        <label class="notify-row"><span><strong>New announcements</strong><br><span class="notify-sub">When the office or a teacher posts an announcement.</span></span>
                            <input type="checkbox" id="ntf-ann" ${notifyAnn ? 'checked' : ''}></label>
                        <label class="notify-row"><span><strong>New scheduled sessions</strong><br><span class="notify-sub">When a new session is added to the calendar.</span></span>
                            <input type="checkbox" id="ntf-sched" ${notifySched ? 'checked' : ''}></label>
                        <div class="hint" id="ntf-msg" style="margin-top:10px;min-height:16px;"></div>
                    </div>
                    <div class="panel" style="margin-top:22px;">
                        <div class="section-title" style="margin-bottom:10px;">Two-Factor Authentication (2FA)</div>
                        <div id="mfa-section"></div>
                    </div>
                    <div class="panel" style="margin-top:22px;">
                        <div class="section-title" style="margin-bottom:6px;">Your Activity</div>
                        <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px;">How much time you've spent logged into the portal.</p>
                        <div id="my-activity"><div class="loader">Loading…</div></div>
                    </div>
                </div>`;

            // Notification preferences — save on toggle via the backend.
            const ntfMsg = document.getElementById('ntf-msg');
            let ntfTimer = null;
            async function saveNotifyPrefs() {
                clearTimeout(ntfTimer);
                ntfMsg.style.color = 'var(--text-muted)';
                ntfMsg.textContent = 'Saving…';
                try {
                    await apiRequest('POST', '/student/notification-prefs', {
                        notify_announcements: document.getElementById('ntf-ann').checked,
                        notify_schedule: document.getElementById('ntf-sched').checked
                    });
                    ntfMsg.style.color = 'var(--green)';
                    ntfMsg.textContent = 'Saved ✓';
                    ntfTimer = setTimeout(() => { ntfMsg.textContent = ''; }, 2500);
                } catch (err) {
                    ntfMsg.style.color = 'var(--red)';
                    ntfMsg.textContent = `Couldn't save: ${err.message}`;
                }
            }
            document.getElementById('ntf-ann').addEventListener('change', saveNotifyPrefs);
            document.getElementById('ntf-sched').addEventListener('change', saveNotifyPrefs);

            // Avatar upload
            const msg = document.getElementById('avatar-msg');
            function showMsg(t, err){ msg.textContent = t; msg.style.color = err ? 'var(--red)' : 'var(--green)'; }
            document.getElementById('prof-avatar-btn').onclick = () => document.getElementById('prof-avatar-input').click();
            document.getElementById('prof-avatar-input').onchange = async (e) => {
                const file = e.target.files[0]; e.target.value = '';
                if (!file) return;
                const ext = (file.name.split('.').pop() || '').toLowerCase();
                if (!file.type.startsWith('image/') || !ALLOWED_IMG.includes(ext)) { showMsg('Please choose an image (PNG, JPG, WEBP or GIF).', true); return; }
                if (file.size > AVATAR_MAX) { showMsg(`Image too large (${(file.size/1024).toFixed(0)} KB). Max 500 KB.`, true); return; }
                showMsg('Uploading…', false);
                try {
                    const uid = AUTH.session.user.id;
                    const path = `${uid}/avatar.${ext}`;
                    const up = await db.storage.from('avatars').upload(path, file, { contentType: file.type, upsert: true });
                    if (up.error) throw new Error(up.error.message);
                    const { data: pub } = db.storage.from('avatars').getPublicUrl(path);
                    const url = `${pub.publicUrl}?t=${Date.now()}`;
                    const upd = await db.from('profiles').update({ avatar_url: url }).eq('id', uid);
                    if (upd.error) throw new Error(upd.error.message);
                    document.getElementById('avatar-big').innerHTML = `<img src="${esc(url)}" alt="">`;
                    const ti = document.getElementById('avatar-inner'); if (ti) ti.innerHTML = `<img src="${esc(url)}" alt="">`;
                    showMsg('Photo updated!', false);
                } catch (err) { showMsg(err.message, true); }
            };

            // Title save
            const detAlert = document.getElementById('det-alert');
            document.getElementById('det-btn').onclick = async () => {
                detAlert.style.display = 'none';
                const title = document.getElementById('f-title').value;
                const btn = document.getElementById('det-btn');
                btn.disabled = true; btn.textContent = 'Saving…';
                try {
                    const { error } = await db.from('profiles').update({ title: title || null }).eq('id', AUTH.session.user.id);
                    if (error) throw new Error(error.message);
                    detAlert.className = 'alert success'; detAlert.textContent = 'Title saved.'; detAlert.style.display = 'block';
                } catch (err) { detAlert.className = 'alert error'; detAlert.textContent = err.message; detAlert.style.display = 'block'; }
                finally { btn.disabled = false; btn.textContent = 'Save Title'; }
            };

            // Password change
            const alertBox = document.getElementById('pw-alert');
            function showAlert(m,t){ alertBox.className = `alert ${t}`; alertBox.textContent = m; alertBox.style.display='block'; }
            document.getElementById('pw-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';
                const p1 = document.getElementById('pw1').value, p2 = document.getElementById('pw2').value;
                const btn = document.getElementById('pw-btn');
                if (p1.length < 8) { showAlert('Password must be at least 8 characters.', 'error'); return; }
                if (p1 !== p2) { showAlert('The two passwords do not match.', 'error'); return; }
                btn.disabled = true; btn.textContent = 'Updating…';
                try {
                    const { error } = await db.auth.updateUser({ password: p1 });
                    if (error) throw new Error(error.message);
                    document.getElementById('pw-form').reset();
                    showAlert('Password updated successfully.', 'success');
                } catch (err) { showAlert(err.message, 'error'); }
                finally { btn.disabled = false; btn.textContent = 'Update Password'; }
            });

            renderMfaSection('mfa-section');
            loadCertificates();
            loadMyActivity(auth.session.user.id);
        })();

        // ── YOUR ACTIVITY (own login time; filterable) ──
        let _myAllSessions = [];
        let _myFilterFrom = null, _myFilterTo = null, _myActivePreset = 'all';

        function fmtDur(secs) {
            secs = Math.max(0, Math.round(secs));
            const h = Math.floor(secs / 3600);
            const m = Math.floor((secs % 3600) / 60);
            if (h) return `${h}h ${m}m`;
            if (m) return `${m}m`;
            return `${secs}s`;
        }
        function fmtDay(d) { return new Date(d).toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }); }
        function fmtHM(d) { return new Date(d).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
        function _myDateInputVal(d) { return d ? new Date(d).toISOString().slice(0, 10) : ''; }

        function _myFilterBarHtml() {
            const presets = [['today', 'Today'], ['week', 'This week'], ['month', 'This month'], ['all', 'All time']];
            return `
                <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;" id="my-filter-bar">
                    ${presets.map(([id, label]) => `<button class="btn ${_myActivePreset === id ? 'btn-primary' : 'btn-ghost'}" style="padding:7px 14px;font-size:13px;" onclick="setMyActivityFilter('${id}')">${label}</button>`).join('')}
                    <input type="date" id="my-from" style="border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;" value="${_myActivePreset === 'custom' ? _myDateInputVal(_myFilterFrom) : ''}">
                    <span style="color:var(--text-muted);font-size:13px;align-self:center;">to</span>
                    <input type="date" id="my-to" style="border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;" value="${_myActivePreset === 'custom' ? _myDateInputVal(_myFilterTo) : ''}">
                    <button class="btn ${_myActivePreset === 'custom' ? 'btn-primary' : 'btn-ghost'}" style="padding:7px 14px;font-size:13px;" onclick="applyMyCustomFilter()">Apply</button>
                </div>`;
        }

        function setMyActivityFilter(preset) {
            _myActivePreset = preset;
            const now = new Date();
            const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
            if (preset === 'today') { _myFilterFrom = startOfDay(now); _myFilterTo = null; }
            else if (preset === 'week') { const f = startOfDay(now); f.setDate(f.getDate() - f.getDay()); _myFilterFrom = f; _myFilterTo = null; }
            else if (preset === 'month') { _myFilterFrom = new Date(now.getFullYear(), now.getMonth(), 1); _myFilterTo = null; }
            else { _myFilterFrom = null; _myFilterTo = null; }
            renderMyActivityFiltered();
        }

        function applyMyCustomFilter() {
            const fromVal = document.getElementById('my-from').value;
            const toVal = document.getElementById('my-to').value;
            _myActivePreset = 'custom';
            _myFilterFrom = fromVal ? new Date(fromVal + 'T00:00:00') : null;
            _myFilterTo = toVal ? new Date(toVal + 'T23:59:59') : null;
            renderMyActivityFiltered();
        }

        async function loadMyActivity(studentId) {
            const box = document.getElementById('my-activity');
            const { data, error } = await db.from('login_sessions')
                .select('started_at, last_seen_at, ended_at')
                .eq('student_id', studentId)
                .order('started_at', { ascending: false });
            if (error) { box.innerHTML = `<div class="hint" style="color:var(--red)">Couldn't load your activity.</div>`; return; }
            _myAllSessions = data || [];
            if (_myAllSessions.length === 0) {
                box.innerHTML = `<div class="hint">No activity recorded yet — this fills in as you use the portal.</div>`;
                return;
            }
            renderMyActivityFiltered();
        }

        function renderMyActivityFiltered() {
            const box = document.getElementById('my-activity');
            const bar = document.getElementById('my-filter-bar');
            const sessions = _myAllSessions.filter(s => {
                const t = new Date(s.started_at).getTime();
                if (_myFilterFrom && t < _myFilterFrom.getTime()) return false;
                if (_myFilterTo && t > _myFilterTo.getTime()) return false;
                return true;
            });

            const days = {};
            let grand = 0;
            sessions.forEach(s => {
                const start = new Date(s.started_at);
                const end = s.ended_at ? new Date(s.ended_at) : (s.last_seen_at ? new Date(s.last_seen_at) : start);
                const dur = Math.max(0, (end - start) / 1000);
                grand += dur;
                const k = fmtDay(s.started_at);
                if (!days[k]) days[k] = { total: 0, rows: [], sort: start.getTime() };
                days[k].total += dur;
                days[k].sort = Math.max(days[k].sort, start.getTime());
                days[k].rows.push({ start, end, dur });
            });
            const ordered = Object.keys(days).sort((a, b) => days[b].sort - days[a].sort);

            box.innerHTML = `
                ${_myFilterBarHtml()}
                <div style="font-size:14px;font-weight:700;color:var(--navy-800);margin-bottom:14px;">Total time: ${fmtDur(grand)} · ${sessions.length} session${sessions.length === 1 ? '' : 's'}</div>
                ${ordered.length === 0 ? `<div class="hint">No activity in this range.</div>` : ordered.map(k => {
                    const d = days[k];
                    d.rows.sort((a, b) => a.start - b.start);
                    return `<div style="border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;">
                        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--navy-800);margin-bottom:6px;">
                            <span>${esc(k)}</span><span>${fmtDur(d.total)}</span>
                        </div>
                        ${d.rows.map(r => `<div style="font-size:12.5px;color:var(--text-muted);padding:3px 0;">${fmtHM(r.start)} → ${fmtHM(r.end)} <span style="color:var(--navy-800);font-weight:600;">(${fmtDur(r.dur)})</span></div>`).join('')}
                    </div>`;
                }).join('')}`;
        }

        // ── MY CERTIFICATES (diploma + recommendation letter) ──
        async function loadCertificates() {
            const panel = document.getElementById('certs-panel');
            const list = document.getElementById('certs-list');
            try {
                const res = await apiRequest('GET', '/student/my-diplomas');
                const items = (res && res.items) || [];
                if (!items.length) return;   // keep the panel hidden until something is issued
                list.innerHTML = items.map(it => {
                    const when = it.issued_at ? new Date(it.issued_at).toLocaleDateString() : '';
                    const dl = (url, label, icon) => url
                        ? `<a class="btn btn-primary btn-sm" href="${esc(url)}" target="_blank" rel="noopener" style="margin-right:8px;">${icon} ${label}</a>`
                        : `<span class="hint">${label} unavailable</span>`;
                    return `<div style="border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;">
                        <div style="font-weight:700;color:var(--navy-800);margin-bottom:4px;">${esc(it.course_name || 'Premedical Studies')}</div>
                        <div class="hint" style="margin-bottom:12px;">Issued ${esc(when)}${it.final_grade ? ' · ' + esc(it.final_grade) : ''}</div>
                        ${dl(it.diploma_url, 'Download Diploma', '📜')}
                        ${dl(it.letter_url, 'Recommendation Letter', '✉️')}
                    </div>`;
                }).join('');
                panel.style.display = 'block';
            } catch (e) {
                // Quietly leave the panel hidden if the request fails.
            }
        }
    </script>
</body>
</html>
