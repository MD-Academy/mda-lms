<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>Medical Doctor Academy — Messages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/student.css?v=2">
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script>
        function esc(s){ return s ? String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : ''; }
        function fmtStamp(iso){ return iso ? new Date(iso).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : ''; }

        // Only one page is ever fetched — the record builds up over the whole programme.
        let FB_PAGE = 1, FB_SIZE = 25, FB_TOTAL = 0;
        let REPLIES = {};              // note_id -> [replies], both sides
        let NEW_REPLIES = new Set();   // teacher-reply ids that are still unread
        let NEW_NOTES = new Set();     // feedback-note ids that are still unread
        const COURSE_NAMES = {};
        let STUDENT_NAME = 'You';
        let STUDENT_AVATAR = null;     // the signed-in student's own photo
        let STAFF = {};                // staff id -> {full_name, avatar_url}

        function initials(name){ return (name || '?').trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase() || '?'; }
        // The student's own round avatar (photo or initials) — shown when they speak.
        function meAvatar(small){
            const cls = 'mini-ava' + (small ? ' sm' : '');
            const ini = esc(initials(STUDENT_NAME));
            if (STUDENT_AVATAR){
                return `<span class="${cls}" data-initials="${ini}"><img src="${esc(STUDENT_AVATAR)}" alt="" onerror="this.parentNode.classList.add('is-fallback');this.remove();"></span>`;
            }
            return `<span class="${cls} is-fallback" data-initials="${ini}"></span>`;
        }
        // A round avatar for a staff member: photo if we have it, else initials.
        function staffAvatar(id, name, small){
            const s = (id && STAFF[id]) || null;
            const nm = (s && s.full_name) || name || 'Staff';
            const cls = 'mini-ava' + (small ? ' sm' : '') + (s ? ' clickable' : '');
            const sid = s ? ` data-staff="${esc(id)}"` : '';
            if (s && s.avatar_url){
                return `<span class="${cls} has-photo"${sid} data-name="${esc(nm)}" data-full="${esc(s.avatar_url)}"><img src="${esc(s.avatar_url)}" alt="" loading="lazy" onerror="this.parentNode.classList.add('is-fallback');this.remove();"></span>`;
            }
            return `<span class="${cls} is-fallback"${sid} data-initials="${esc(initials(nm))}"></span>`;
        }

        // Click a staff member (roster chip or their avatar) to open their profile card.
        document.addEventListener('click', e => {
            const holder = e.target.closest('[data-staff]');
            if (holder && STAFF[holder.dataset.staff]) { openStaffProfile(holder.dataset.staff); return; }
            // A photo with no staff profile (unknown author) just enlarges.
            const ava = e.target.closest('.mini-ava.has-photo');
            if (ava && ava.dataset.full) openPhoto(ava.dataset.full, ava.dataset.name);
        });

        // Full profile card: photo, role, specialty, bio, education.
        function openStaffProfile(id){
            const s = STAFF[id]; if (!s) return;
            const big = s.avatar_url
                ? `<span class="sp-photo has-photo" data-full="${esc(s.avatar_url)}" data-name="${esc(s.full_name)}"><img src="${esc(s.avatar_url)}" alt=""></span>`
                : `<span class="sp-photo is-fallback" data-initials="${esc(initials(s.full_name))}"></span>`;
            const line = (k, v) => v ? `<div class="sp-line"><span class="k">${k}</span><span>${esc(v)}</span></div>` : '';
            const bio = s.bio ? `<p class="sp-bio">${esc(s.bio)}</p>` : '';
            const details = (s.specialty || s.education) ? `<div class="sp-lines">${line('Specialty', s.specialty)}${line('Education', s.education)}</div>` : '';
            const empty = (!s.bio && !s.specialty && !s.education) ? `<p class="sp-bio" style="color:var(--text-muted);">No profile details yet.</p>` : '';
            let ov = document.getElementById('staff-profile');
            if (!ov){
                ov = document.createElement('div');
                ov.id = 'staff-profile';
                ov.className = 'sp-overlay';
                ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); });
                document.body.appendChild(ov);
            }
            ov.innerHTML = `<div class="sp-card">
                <button class="sp-close" onclick="document.getElementById('staff-profile').classList.remove('open')" title="Close">&times;</button>
                <div class="sp-head">${big}<div><div class="sp-name">${esc(s.full_name)}</div>${s.job_title ? `<div class="sp-role">${esc(s.job_title)}</div>` : ''}</div></div>
                ${bio}${details}${empty}
                <div class="sp-contact">
                    <button class="btn btn-primary" onclick="startContact('${esc(id)}')">✉️ Message ${esc((s.full_name||'').split(' ')[0] || 'them')}</button>
                </div>
            </div>`;
            ov.classList.add('open');
        }

        // Compose a new message to a staff member.
        function startContact(id){
            const s = STAFF[id]; if (!s) return;
            let ov = document.getElementById('contact-modal');
            if (!ov){
                ov = document.createElement('div');
                ov.id = 'contact-modal';
                ov.className = 'sp-overlay';
                ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); });
                document.body.appendChild(ov);
            }
            ov.innerHTML = `<div class="sp-card">
                <button class="sp-close" onclick="document.getElementById('contact-modal').classList.remove('open')" title="Close">&times;</button>
                <div style="font-weight:700;color:var(--navy-800);font-size:17px;">Message ${esc(s.full_name)}</div>
                <div style="font-size:12.5px;color:var(--text-muted);margin:4px 0 14px;">${s.job_title ? esc(s.job_title) + ' · ' : ''}They'll get your message and can reply — you'll see it here and in your bell.</div>
                <textarea id="contact-body" rows="5" maxlength="3000" placeholder="Write your message…" style="width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;resize:vertical;"></textarea>
                <div style="display:flex;align-items:center;gap:10px;margin-top:12px;">
                    <button class="btn btn-primary" id="contact-send" onclick="sendContact('${esc(id)}', this)">Send message</button>
                    <span id="contact-msg" style="font-size:12.5px;"></span>
                </div>
            </div>`;
            const sp = document.getElementById('staff-profile'); if (sp) sp.classList.remove('open');
            ov.classList.add('open');
            setTimeout(() => { const t = document.getElementById('contact-body'); if (t) t.focus(); }, 60);
        }

        async function sendContact(id, btn){
            const ta = document.getElementById('contact-body');
            const msg = document.getElementById('contact-msg');
            const text = (ta.value || '').trim();
            msg.textContent = '';
            if (!text){ msg.style.color = 'var(--red)'; msg.textContent = 'Write your message first.'; return; }
            btn.disabled = true; const label = btn.textContent; btn.textContent = 'Sending…';
            try {
                const r = await apiRequest('POST', '/student/contact-staff', { staff_id: id, body: text });
                const targetId = r && r.note_id;
                msg.style.color = 'var(--green)';
                msg.textContent = (r && r.continued) ? 'Added to your conversation ✓' : (r && r.emailed ? 'Sent — they\'ve been emailed ✓' : 'Sent ✓');
                setTimeout(async () => {
                    const ov = document.getElementById('contact-modal'); if (ov) ov.classList.remove('open');
                    FB_PAGE = 1; await loadPage();
                    // Jump to the conversation so the student sees their message land.
                    if (targetId){ const el = document.getElementById('note-' + targetId); if (el) el.scrollIntoView({ behavior:'smooth', block:'center' }); }
                }, 900);
            } catch (e) {
                msg.style.color = 'var(--red)'; msg.textContent = e.message || 'Could not send. Please try again.';
                btn.disabled = false; btn.textContent = label;
            }
        }

        function openPhoto(src, name){
            let ov = document.getElementById('photo-lightbox');
            if (!ov){
                ov = document.createElement('div');
                ov.id = 'photo-lightbox';
                ov.className = 'photo-lightbox';
                ov.innerHTML = `<div class="pl-inner"><img id="pl-img" alt=""><div id="pl-name" class="pl-name"></div></div>`;
                ov.addEventListener('click', () => ov.classList.remove('open'));
                document.body.appendChild(ov);
            }
            document.getElementById('pl-img').src = src;
            document.getElementById('pl-name').textContent = name || '';
            ov.classList.add('open');
        }
        // Inside the profile card, clicking the photo enlarges it.
        document.addEventListener('click', e => {
            const ph = e.target.closest('#staff-profile .sp-photo.has-photo');
            if (ph && ph.dataset.full){ e.stopPropagation(); openPhoto(ph.dataset.full, ph.dataset.name); }
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape'){
                ['photo-lightbox','staff-profile'].forEach(id => { const ov = document.getElementById(id); if (ov) ov.classList.remove('open'); });
            }
        });

        (async () => {
            const auth = await requireStudent();
            if (!auth) return;
            STUDENT_NAME = (auth.profile && auth.profile.full_name) || 'You';
            STUDENT_AVATAR = (auth.profile && auth.profile.avatar_url) || null;
            renderLayout('feedback', 'Messages', 'Feedback from your teachers, and your messages to staff', auth.profile);

            document.getElementById('page-content').innerHTML = `
                <div id="staff-box"></div>
                <div id="box"><div class="loader">Loading your messages…</div></div>`;
            await loadStaff();   // so teacher photos are ready before the feedback renders
            await loadPage();
        })();

        // The teaching & supporting staff — name + photo, so students know who's who.
        async function loadStaff(){
            const box = document.getElementById('staff-box');
            try {
                const r = await apiRequest('GET', '/student/staff-directory');
                const staff = (r && r.staff) || [];
                STAFF = {};
                staff.forEach(s => { STAFF[s.id] = s; });
                if (!staff.length) { box.innerHTML = ''; return; }
                const chips = staff.map(s => `
                    <span class="staff-chip" data-staff="${s.id}" title="View profile">${staffAvatar(s.id, s.full_name, false)}<span class="who"><span class="nm">${esc(s.full_name)}</span>${s.job_title ? `<span class="role">${esc(s.job_title)}</span>` : ''}</span></span>`).join('');
                box.innerHTML = `
                    <div class="section">
                        <div class="att-card">
                            <div style="font-weight:700;color:var(--navy-800);font-size:15px;">Your Teaching &amp; Supporting Staff</div>
                            <div style="font-size:12.5px;color:var(--text-muted);margin-top:3px;">The people here to help you through the programme. Tap anyone to see their profile and <strong>message them</strong>.</div>
                            <div class="staff-strip">${chips}</div>
                        </div>
                    </div>`;
            } catch (e) {
                console.error('[feedback] staff directory failed:', e);
                box.innerHTML = '';   // never block the page over the roster
            }
        }

        async function loadPage(){
            const box = document.getElementById('box');
            const from = (FB_PAGE - 1) * FB_SIZE, to = from + FB_SIZE - 1;

            // RLS returns only this student's own entries, and only the ones a teacher chose to share.
            const { data, count, error } = await db.from('student_notes')
                .select('id, body, course_id, author_id, author_name, initiated_by, staff_id, staff_name, created_at', { count: 'exact' })
                .order('created_at', { ascending: false })
                .range(from, to);

            if (error) {
                console.error('[feedback] failed to load:', error);
                box.innerHTML = `<div class="empty-state"><h3 style="color:var(--red)">Couldn't load your feedback</h3><p>Please refresh the page. If it keeps happening, contact the office.</p></div>`;
                return;
            }

            const notes = data || [];
            FB_TOTAL = count || 0;

            // The whole conversation on each note (both sides), for the page we're showing.
            REPLIES = {};
            NEW_REPLIES = new Set();
            NEW_NOTES = new Set();
            const noteIds = notes.map(n => n.id);
            const { data: { session } } = await db.auth.getSession();
            const myId = session && session.user.id;

            if (noteIds.length && myId) {
                // Which feedback notes are still unread → highlight them (orange).
                const { data: readNotes } = await db.from('notification_reads')
                    .select('ref_id').eq('student_id', myId).eq('kind', 'feedback').in('ref_id', noteIds);
                const readNoteSet = new Set((readNotes || []).map(r => r.ref_id));
                // Only feedback a teacher wrote can be "new" to the student — not their own messages.
                notes.forEach(n => { if (n.initiated_by !== 'student' && !readNoteSet.has(n.id)) NEW_NOTES.add(n.id); });

                const { data: reps } = await db.from('student_note_replies')
                    .select('id, note_id, author_role, author_id, author_name, body, created_at')
                    .in('note_id', noteIds).order('created_at', { ascending: true });
                (reps || []).forEach(r => { (REPLIES[r.note_id] = REPLIES[r.note_id] || []).push(r); });

                // Which teacher replies are still unread → highlight them as new.
                const staffReplyIds = (reps || []).filter(r => r.author_role === 'staff').map(r => r.id);
                if (staffReplyIds.length) {
                    const { data: readRows } = await db.from('notification_reads')
                        .select('ref_id').eq('student_id', myId).eq('kind', 'reply').in('ref_id', staffReplyIds);
                    const readSet = new Set((readRows || []).map(r => r.ref_id));
                    staffReplyIds.forEach(id => { if (!readSet.has(id)) NEW_REPLIES.add(id); });
                }
            }

            if (FB_TOTAL === 0) {
                box.innerHTML = `<div class="empty-state">
                    <h3>No messages yet</h3>
                    <p>Feedback your teachers write appears here — and you can message any staff member from the list above. You'll get a notification in the bell whenever there's something new.</p>
                </div>`;
                return;
            }

            // Course names, so a note tied to a course can say which one.
            const missing = [...new Set(notes.map(n => n.course_id).filter(id => id && !COURSE_NAMES[id]))];
            if (missing.length) {
                const { data: cs } = await db.from('courses').select('id, name').in('id', missing);
                (cs || []).forEach(c => { COURSE_NAMES[c.id] = c.name; });
            }

            const rows = notes.map(n => {
                if (n.initiated_by === 'student') {
                    // A message you started with a staff member.
                    return `
                    <div class="msg-note" id="note-${n.id}">
                        <div class="fb-note-head">
                            ${meAvatar(true)}
                            <strong>You → ${esc(n.staff_name || 'Staff')}</strong>
                            <span>· ${esc(fmtStamp(n.created_at))}</span>
                        </div>
                        <div class="fb-note-body">${esc(n.body)}</div>
                        ${threadHtml(n.id)}
                    </div>`;
                }
                const isNew = NEW_NOTES.has(n.id);
                return `
                <div class="fb-note ${isNew ? 'fb-note-new' : ''}" id="note-${n.id}">
                    <div class="fb-note-head">
                        ${staffAvatar(n.author_id, n.author_name, true)}
                        <strong>${esc(n.author_name || 'Your teacher')}</strong>
                        <span>· ${esc(fmtStamp(n.created_at))}${n.course_id && COURSE_NAMES[n.course_id] ? ' · about ' + esc(COURSE_NAMES[n.course_id]) : ''}</span>
                        ${isNew ? '<span class="fb-new-pill">New</span>' : ''}
                    </div>
                    <div class="fb-note-body">${esc(n.body)}</div>
                    ${threadHtml(n.id)}
                </div>`;
            }).join('');

            const totalPages = Math.max(1, Math.ceil(FB_TOTAL / FB_SIZE));
            const start = from + 1, end = Math.min(FB_PAGE * FB_SIZE, FB_TOTAL);

            // Reuses the portal's own pager component (see .pager in student.css).
            const pager = `
                <div class="pager">
                    <div class="pager-info">Showing ${start}–${end} of ${FB_TOTAL} — newest first</div>
                    <div class="pager-ctrls">
                        <label class="pager-size">Per page
                            <select onchange="setFbSize(this.value)">
                                ${[25, 50, 100].map(s => `<option value="${s}" ${s === FB_SIZE ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                        </label>
                        <button class="pager-btn" ${FB_PAGE <= 1 ? 'disabled' : ''} onclick="changeFbPage(-1)">‹ Newer</button>
                        <span class="pager-page">${FB_PAGE} / ${totalPages}</span>
                        <button class="pager-btn" ${FB_PAGE >= totalPages ? 'disabled' : ''} onclick="changeFbPage(1)">Older ›</button>
                    </div>
                </div>`;

            box.innerHTML = `
                <div class="section">
                    <div class="section-title">💬 Your Messages</div>
                    <div class="att-card">
                        <p style="font-size:13px;color:var(--text-muted);margin:-4px 0 16px;line-height:1.55;">
                            Feedback your teachers have written for you, and messages you've sent staff. Newest first — each is its own
                            conversation you can reply to. To start a new message, tap a staff member above.
                        </p>
                        <div style="margin-top:16px;">${rows}</div>
                        ${pager}
                    </div>
                </div>`;

            // Only what the student actually saw counts as read. If they have more
            // unread further back, it stays on the bell until they page to it.
            markSeen('feedback', notes.map(n => n.id));
            // Staff replies now on screen are read too, so their bell alerts clear.
            const staffReplyIds = [];
            Object.values(REPLIES).forEach(arr => arr.forEach(r => { if (r.author_role === 'staff') staffReplyIds.push(r.id); }));
            markSeen('reply', staffReplyIds);
        }

        // The conversation under one feedback entry, plus the student's reply box.
        function threadHtml(noteId){
            const thread = REPLIES[noteId] || [];
            const bubbles = thread.map(r => {
                const mine = r.author_role === 'student';
                const isNew = !mine && NEW_REPLIES.has(r.id);
                const cls = mine ? 'reply-mine' : ('reply-in' + (isNew ? ' reply-new' : ''));
                return `<div class="reply-row ${cls}">
                    <div class="reply-head">
                        ${mine ? meAvatar(true) : staffAvatar(r.author_id, r.author_name, true)}
                        <strong>${mine ? 'You' : esc(r.author_name || 'Your teacher')}</strong>
                        <span>· ${esc(fmtStamp(r.created_at))}</span>
                        ${isNew ? '<span class="reply-new-pill">New</span>' : ''}
                    </div>
                    <div class="reply-body">${esc(r.body)}</div>
                </div>`;
            }).join('');

            return `
                <div style="width:100%;margin-top:4px;">
                    ${bubbles}
                    <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">
                        <textarea id="reply-${noteId}" rows="2" placeholder="Reply to your teacher…"
                            style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:10px;
                                   font-family:inherit;font-size:14px;resize:vertical;"></textarea>
                        <div style="display:flex;align-items:center;gap:10px;">
                            <button class="btn btn-primary btn-sm" onclick="sendReply('${noteId}', this)">Send reply</button>
                            <span id="reply-msg-${noteId}" style="font-size:12.5px;"></span>
                        </div>
                    </div>
                </div>`;
        }

        async function sendReply(noteId, btn){
            const ta = document.getElementById('reply-' + noteId);
            const msg = document.getElementById('reply-msg-' + noteId);
            const text = (ta.value || '').trim();
            msg.textContent = '';
            if (!text){ msg.style.color = 'var(--red)'; msg.textContent = 'Write your reply first.'; return; }
            btn.disabled = true; const label = btn.textContent; btn.textContent = 'Sending…';
            try {
                const r = await apiRequest('POST', '/student/feedback-reply', { note_id: noteId, body: text });
                // Show it immediately without a full reload.
                (REPLIES[noteId] = REPLIES[noteId] || []).push({
                    id: 'tmp', note_id: noteId, author_role: 'student',
                    author_name: STUDENT_NAME, body: text, created_at: new Date().toISOString()
                });
                ta.value = '';
                rerenderThread(noteId);
                const m2 = document.getElementById('reply-msg-' + noteId);
                if (m2){ m2.style.color = 'var(--green)'; m2.textContent = r && r.emailed ? 'Sent — your teacher has been emailed ✓' : 'Sent ✓'; setTimeout(() => { m2.textContent = ''; }, 4000); }
            } catch (e) {
                msg.style.color = 'var(--red)'; msg.textContent = e.message || 'Could not send. Please try again.';
                btn.disabled = false; btn.textContent = label;
            }
        }

        // Re-draw just one note's thread in place (keeps the rest of the page still).
        function rerenderThread(noteId){
            const ta = document.getElementById('reply-' + noteId);
            if (!ta) return loadPage();
            const container = ta.closest('.att-day');
            if (!container) return loadPage();
            // The thread block is the last child (added by threadHtml).
            const block = ta.closest('div[style*="margin-top:4px"]');
            if (block){ block.outerHTML = threadHtml(noteId); }
        }

        function changeFbPage(delta){
            const totalPages = Math.max(1, Math.ceil(FB_TOTAL / FB_SIZE));
            const n = FB_PAGE + delta;
            if (n < 1 || n > totalPages) return;
            FB_PAGE = n;
            loadPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setFbSize(v){
            FB_SIZE = parseInt(v, 10) || 25;
            FB_PAGE = 1;
            loadPage();
        }

        // Mark the entries on screen as seen (by kind), so the bell count drops.
        async function markSeen(kind, ids){
            if (!ids || !ids.length) return;
            try {
                const { data: { session } } = await db.auth.getSession();
                if (!session) return;
                const rows = ids.map(id => ({ student_id: session.user.id, kind, ref_id: id }));
                await db.from('notification_reads').upsert(rows, { onConflict: 'student_id,kind,ref_id' });
            } catch (e) { /* never block the page */ }
            // The bell loads on its own schedule, so drop these once it's ready
            // rather than assuming it already is.
            dropFromBell(kind, ids, 0);
        }

        function dropFromBell(kind, ids, tries){
            if (typeof _notifUnread === 'undefined' || typeof _renderBell !== 'function') return;
            const seen = new Set(ids.map(String));
            const before = _notifUnread.length;
            _notifUnread = _notifUnread.filter(n => !(n.kind === kind && seen.has(String(n.id))));
            if (before !== _notifUnread.length) { _renderBell(); return; }
            // Nothing matched yet — the bell may still be fetching. Try again briefly.
            if (tries < 6) setTimeout(() => dropFromBell(kind, ids, tries + 1), 500);
        }
    </script>
</body>
</html>
