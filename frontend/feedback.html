<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>Medical Doctor Academy — Feedback from Teachers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/student.css">
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script>
        function esc(s){ return s ? String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : ''; }
        function fmtStamp(iso){ return iso ? new Date(iso).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : ''; }

        // Only one page is ever fetched — the record builds up over the whole programme.
        let FB_PAGE = 1, FB_SIZE = 25, FB_TOTAL = 0;
        let REPLIES = {};              // note_id -> [replies], both sides
        const COURSE_NAMES = {};
        let STUDENT_NAME = 'You';

        (async () => {
            const auth = await requireStudent();
            if (!auth) return;
            STUDENT_NAME = (auth.profile && auth.profile.full_name) || 'You';
            renderLayout('feedback', 'Feedback from Teachers', 'What your teachers have written for you', auth.profile);

            document.getElementById('page-content').innerHTML = `<div id="box"><div class="loader">Loading your feedback…</div></div>`;
            await loadPage();
        })();

        async function loadPage(){
            const box = document.getElementById('box');
            const from = (FB_PAGE - 1) * FB_SIZE, to = from + FB_SIZE - 1;

            // RLS returns only this student's own entries, and only the ones a teacher chose to share.
            const { data, count, error } = await db.from('student_notes')
                .select('id, body, course_id, author_name, created_at', { count: 'exact' })
                .order('created_at', { ascending: false })
                .range(from, to);

            if (error) {
                console.error('[feedback] failed to load:', error);
                box.innerHTML = `<div class="empty-state"><h3 style="color:var(--red)">Couldn't load your feedback</h3><p>Please refresh the page. If it keeps happening, contact the office.</p></div>`;
                return;
            }

            const notes = data || [];
            FB_TOTAL = count || 0;

            // The whole conversation on each note (both sides), for the page we're showing.
            REPLIES = {};
            const noteIds = notes.map(n => n.id);
            if (noteIds.length) {
                const { data: reps } = await db.from('student_note_replies')
                    .select('id, note_id, author_role, author_name, body, created_at')
                    .in('note_id', noteIds).order('created_at', { ascending: true });
                (reps || []).forEach(r => { (REPLIES[r.note_id] = REPLIES[r.note_id] || []).push(r); });
            }

            if (FB_TOTAL === 0) {
                box.innerHTML = `<div class="empty-state">
                    <h3>No feedback yet</h3>
                    <p>When one of your teachers writes feedback for you, it appears here — and you'll get a notification in the bell at the top of the page.</p>
                </div>`;
                return;
            }

            // Course names, so a note tied to a course can say which one.
            const missing = [...new Set(notes.map(n => n.course_id).filter(id => id && !COURSE_NAMES[id]))];
            if (missing.length) {
                const { data: cs } = await db.from('courses').select('id, name').in('id', missing);
                (cs || []).forEach(c => { COURSE_NAMES[c.id] = c.name; });
            }

            const rows = notes.map(n => `
                <div class="att-day" style="align-items:flex-start;flex-direction:column;gap:7px;">
                    <div style="font-size:12px;color:var(--text-muted);">
                        <strong style="color:var(--navy-800);">${esc(fmtStamp(n.created_at))}</strong>
                        · ${esc(n.author_name || 'Your teacher')}${n.course_id && COURSE_NAMES[n.course_id] ? ' · about ' + esc(COURSE_NAMES[n.course_id]) : ''}
                    </div>
                    <div style="font-size:14.5px;line-height:1.7;color:var(--text);white-space:pre-wrap;">${esc(n.body)}</div>
                    ${threadHtml(n.id)}
                </div>`).join('');

            const totalPages = Math.max(1, Math.ceil(FB_TOTAL / FB_SIZE));
            const start = from + 1, end = Math.min(FB_PAGE * FB_SIZE, FB_TOTAL);

            // Reuses the portal's own pager component (see .pager in student.css).
            const pager = `
                <div class="pager">
                    <div class="pager-info">Showing ${start}–${end} of ${FB_TOTAL} — newest first</div>
                    <div class="pager-ctrls">
                        <label class="pager-size">Per page
                            <select onchange="setFbSize(this.value)">
                                ${[25, 50, 100].map(s => `<option value="${s}" ${s === FB_SIZE ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                        </label>
                        <button class="pager-btn" ${FB_PAGE <= 1 ? 'disabled' : ''} onclick="changeFbPage(-1)">‹ Newer</button>
                        <span class="pager-page">${FB_PAGE} / ${totalPages}</span>
                        <button class="pager-btn" ${FB_PAGE >= totalPages ? 'disabled' : ''} onclick="changeFbPage(1)">Older ›</button>
                    </div>
                </div>`;

            box.innerHTML = `
                <div class="section">
                    <div class="section-title">💬 Feedback from Your Teachers</div>
                    <div class="att-card">
                        <p style="font-size:13px;color:var(--text-muted);margin:-4px 0 16px;line-height:1.55;">
                            Personal feedback your teachers have written for you — about how you're progressing, what to work on,
                            or advice after a class. The newest is first, and earlier feedback stays here so you can look back on it.
                        </p>
                        <div class="att-list">${rows}</div>
                        ${pager}
                    </div>
                </div>`;

            // Only what the student actually saw counts as read. If they have more
            // unread further back, it stays on the bell until they page to it.
            markSeen('feedback', notes.map(n => n.id));
            // Staff replies now on screen are read too, so their bell alerts clear.
            const staffReplyIds = [];
            Object.values(REPLIES).forEach(arr => arr.forEach(r => { if (r.author_role === 'staff') staffReplyIds.push(r.id); }));
            markSeen('reply', staffReplyIds);
        }

        // The conversation under one feedback entry, plus the student's reply box.
        function threadHtml(noteId){
            const thread = REPLIES[noteId] || [];
            const bubbles = thread.map(r => {
                const mine = r.author_role === 'student';
                return `<div style="margin-top:9px;padding:10px 12px;border-radius:10px;
                        background:${mine ? '#eef4ff' : '#fdf0f6'};
                        border:1px solid ${mine ? '#d6e4ff' : '#f4d3e4'};
                        ${mine ? 'margin-left:22px;' : 'margin-right:22px;'}">
                    <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:3px;">
                        <strong style="color:var(--navy-800);">${mine ? 'You' : esc(r.author_name || 'Your teacher')}</strong>
                        · ${esc(fmtStamp(r.created_at))}
                    </div>
                    <div style="font-size:14px;line-height:1.6;color:var(--text);white-space:pre-wrap;">${esc(r.body)}</div>
                </div>`;
            }).join('');

            return `
                <div style="width:100%;margin-top:4px;">
                    ${bubbles}
                    <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">
                        <textarea id="reply-${noteId}" rows="2" placeholder="Reply to your teacher…"
                            style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:10px;
                                   font-family:inherit;font-size:14px;resize:vertical;"></textarea>
                        <div style="display:flex;align-items:center;gap:10px;">
                            <button class="btn btn-primary btn-sm" onclick="sendReply('${noteId}', this)">Send reply</button>
                            <span id="reply-msg-${noteId}" style="font-size:12.5px;"></span>
                        </div>
                    </div>
                </div>`;
        }

        async function sendReply(noteId, btn){
            const ta = document.getElementById('reply-' + noteId);
            const msg = document.getElementById('reply-msg-' + noteId);
            const text = (ta.value || '').trim();
            msg.textContent = '';
            if (!text){ msg.style.color = 'var(--red)'; msg.textContent = 'Write your reply first.'; return; }
            btn.disabled = true; const label = btn.textContent; btn.textContent = 'Sending…';
            try {
                const r = await apiRequest('POST', '/student/feedback-reply', { note_id: noteId, body: text });
                // Show it immediately without a full reload.
                (REPLIES[noteId] = REPLIES[noteId] || []).push({
                    id: 'tmp', note_id: noteId, author_role: 'student',
                    author_name: STUDENT_NAME, body: text, created_at: new Date().toISOString()
                });
                ta.value = '';
                rerenderThread(noteId);
                const m2 = document.getElementById('reply-msg-' + noteId);
                if (m2){ m2.style.color = 'var(--green)'; m2.textContent = r && r.emailed ? 'Sent — your teacher has been emailed ✓' : 'Sent ✓'; setTimeout(() => { m2.textContent = ''; }, 4000); }
            } catch (e) {
                msg.style.color = 'var(--red)'; msg.textContent = e.message || 'Could not send. Please try again.';
                btn.disabled = false; btn.textContent = label;
            }
        }

        // Re-draw just one note's thread in place (keeps the rest of the page still).
        function rerenderThread(noteId){
            const ta = document.getElementById('reply-' + noteId);
            if (!ta) return loadPage();
            const container = ta.closest('.att-day');
            if (!container) return loadPage();
            // The thread block is the last child (added by threadHtml).
            const block = ta.closest('div[style*="margin-top:4px"]');
            if (block){ block.outerHTML = threadHtml(noteId); }
        }

        function changeFbPage(delta){
            const totalPages = Math.max(1, Math.ceil(FB_TOTAL / FB_SIZE));
            const n = FB_PAGE + delta;
            if (n < 1 || n > totalPages) return;
            FB_PAGE = n;
            loadPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setFbSize(v){
            FB_SIZE = parseInt(v, 10) || 25;
            FB_PAGE = 1;
            loadPage();
        }

        // Mark the entries on screen as seen (by kind), so the bell count drops.
        async function markSeen(kind, ids){
            if (!ids || !ids.length) return;
            try {
                const { data: { session } } = await db.auth.getSession();
                if (!session) return;
                const rows = ids.map(id => ({ student_id: session.user.id, kind, ref_id: id }));
                await db.from('notification_reads').upsert(rows, { onConflict: 'student_id,kind,ref_id' });
            } catch (e) { /* never block the page */ }
            // The bell loads on its own schedule, so drop these once it's ready
            // rather than assuming it already is.
            dropFromBell(kind, ids, 0);
        }

        function dropFromBell(kind, ids, tries){
            if (typeof _notifUnread === 'undefined' || typeof _renderBell !== 'function') return;
            const seen = new Set(ids.map(String));
            const before = _notifUnread.length;
            _notifUnread = _notifUnread.filter(n => !(n.kind === kind && seen.has(String(n.id))));
            if (before !== _notifUnread.length) { _renderBell(); return; }
            // Nothing matched yet — the bell may still be fetching. Try again briefly.
            if (tries < 6) setTimeout(() => dropFromBell(kind, ids, tries + 1), 500);
        }
    </script>
</body>
</html>
